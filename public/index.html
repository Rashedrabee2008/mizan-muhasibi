<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>الميزان - نظام محاسبة ونقاط بيع متكامل</title>
    <!-- الأنماط -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* جميع الأنماط كما هي */
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
        /* ... باقي الأنماط ... */
    </style>
</head>
<body>
    <!-- ===== LOGIN ===== -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <div class="logo"><i class="fas fa-scale-balanced"></i></div>
            <h1>الميزان</h1>
            <p class="subtitle">نظام محاسبة ونقاط بيع متكامل</p>
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور..." onkeydown="if(event.key==='Enter') checkLogin()" />
            </div>
            <button class="btn btn-primary" onclick="checkLogin()"><i class="fas fa-unlock"></i> دخول</button>
            <div class="error-msg" id="loginError">❌ كلمة المرور غير صحيحة</div>
            <div class="hint">🔒 كلمة المرور الافتراضية: <strong>123456</strong></div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle">تعديل</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="appContent" style="display:none;">
        <!-- جميع أقسام التطبيق -->
        <!-- ... -->
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.0/dist/quagga.min.js"></script>
    
    <!-- ملفات التطبيق -->
    <script src="../src/data.js"></script>
    <script src="../src/utils.js"></script>
    <script src="../src/firebase.js"></script>
    <script src="../src/ui.js"></script>
    <script src="../src/app.js"></script>
    
    <script>
        // ===== التهيئة =====
        document.addEventListener('DOMContentLoaded', function() {
            loadAllData();
            seedData();
            refreshAllPages();

            if (localStorage.getItem('app_unlocked') === 'true') {
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('appContent').style.display = 'block';
                setTimeout(() => {
                    populateAllSelects();
                    refreshAllPages();
                    startAutoBackup();
                    syncFromFirebase();
                    updateUIByPermissions();
                    updateClock();
                }, 300);
            }

            console.log('✅ الميزان v3.0.0 - نظام محاسبة متكامل');
            console.log('🔒 كلمة المرور: 123456');
        });
    </script>
</body>
</html>
