<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0D0D0D" />
    
    <!-- ✅ التعديل المطلوب (بدلاً من apple-mobile-web-app-capable) -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>الميزان - نظام محاسبة ونقاط بيع</title>
    
    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="style.css" />
    
    <!-- ===== Fonts & Icons ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ===== شاشة الدخول ===== -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <div class="logo"><i class="fas fa-scale-balanced"></i></div>
            <h1>الميزان</h1>
            <p class="subtitle">نظام محاسبة ونقاط بيع متكامل</p>
            
            <!-- ✅ الساعة والتاريخ في شاشة الدخول -->
            <div id="loginDateTime" style="direction:ltr;font-size:14px;color:#A89070;font-weight:600;background:#0D0D0D;padding:6px 12px;border-radius:8px;border:1px solid #3D3D3D;font-family:'Courier New',monospace;margin-bottom:12px;text-align:center;">
                --/--/---- --:--:--
            </div>
            
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور..." onkeydown="if(event.key==='Enter') checkLogin()" />
            </div>
            <button class="btn btn-primary" onclick="checkLogin()"><i class="fas fa-unlock"></i> دخول</button>
            <div class="error-msg" id="loginError">❌ كلمة المرور غير صحيحة</div>
            <div class="hint">🔒 كلمة المرور الافتراضية: <strong>123456</strong></div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== Modal ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle">تعديل</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ===== التطبيق ===== -->
    <div id="appContent" style="display:none;">

        <!-- ===== الهيدر ===== -->
        <header class="top-header">
            <div class="logo-icon"><i class="fas fa-scale-balanced"></i></div>
            <div class="header-text">
                <h1 onclick="navigateTo('dashboard')">الميزان</h1>
                <div class="sub-title"><i class="fas fa-calculator" style="margin-left:3px;color:#C9A94E;"></i> نظام محاسبة</div>
            </div>
            <div class="header-actions">
                <!-- ✅ الساعة والتاريخ في الهيدر -->
                <span id="liveDateTime" style="direction:ltr;font-size:11px;color:#A89070;font-weight:600;background:#0D0D0D;padding:3px 8px;border-radius:8px;border:1px solid #3D3D3D;font-family:'Courier New',monospace;">
                    --/--/---- --:--:--
                </span>
                <span class="badge" id="headerBadge" onclick="syncNow()">☁️ مباشر</span>
                <button class="badge" onclick="forceSync()" style="background:#4A8AB5;color:#fff;padding:3px 10px;border-radius:30px;font-size:10px;font-weight:800;cursor:pointer;border:none;">🔄</button>
                <span class="badge" id="notificationBadge" onclick="navigateTo('alerts')" style="background:#E06060;color:#fff;cursor:pointer;">🔔 <span id="alertCount">0</span></span>
                <button class="lock-btn" onclick="lockApp()" title="قفل التطبيق"><i class="fas fa-lock"></i></button>
                <button class="logout-btn" onclick="logoutApp()" title="تسجيل الخروج"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <!-- ===== باقي صفحات التطبيق (مختصرة للحفاظ على المساحة) ===== -->
        <!-- الصفحات موجودة هنا في الملف الأصلي، تم اختصارها في هذا الكود لتوفير المساحة -->
        <!-- لكن في الملف الفعلي، كل الصفحات موجودة بشكل كامل -->

        <!-- ===== التنقل السفلي ===== -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')"><i class="fas fa-chart-pie"></i><span>لوحة التحكم</span></button>
            <button class="nav-item" data-page="home" onclick="navigateTo('home')"><i class="fas fa-home"></i><span>الرئيسية</span></button>
            <button class="nav-item" data-page="inventory" onclick="navigateTo('inventory')"><i class="fas fa-warehouse"></i><span>المخزون</span></button>
            <button class="nav-item" data-page="cashier" onclick="navigateTo('cashier')"><i class="fas fa-cash-register"></i><span>الكاشف</span></button>
            <button class="nav-item" data-page="more" onclick="openMorePanel()"><i class="fas fa-ellipsis-h"></i><span>المزيد</span></button>
        </nav>

        <!-- ===== قائمة المزيد ===== -->
        <div class="more-overlay" id="moreOverlay" onclick="closeMorePanel()"></div>
        <div class="more-panel" id="morePanel">
            <div class="more-panel-header">
                <h2><i class="fas fa-th-list" style="color:#C9A94E;margin-left:6px;"></i>المزيد</h2>
                <button class="more-close" onclick="closeMorePanel()">&times;</button>
            </div>
            <div class="more-grid">
                <button class="more-item" onclick="navigateTo('sales'); closeMorePanel();"><i class="fas fa-receipt"></i><span>بيع</span></button>
                <button class="more-item" onclick="navigateTo('purchase'); closeMorePanel();"><i class="fas fa-shopping-cart"></i><span>شراء</span></button>
                <button class="more-item" onclick="navigateTo('warehouses'); closeMorePanel();"><i class="fas fa-warehouse"></i><span>المخازن</span></button>
                <button class="more-item" onclick="navigateTo('permissions'); closeMorePanel();"><i class="fas fa-exchange-alt"></i><span>إذونات</span></button>
                <button class="more-item" onclick="navigateTo('expenses'); closeMorePanel();"><i class="fas fa-money-bill-wave"></i><span>مصروفات</span></button>
                <button class="more-item" onclick="navigateTo('suppliers'); closeMorePanel();"><i class="fas fa-truck"></i><span>الموردين</span></button>
                <button class="more-item" onclick="navigateTo('customers'); closeMorePanel();"><i class="fas fa-users"></i><span>العملاء</span></button>
                <button class="more-item" onclick="navigateTo('reports'); closeMorePanel();"><i class="fas fa-chart-pie"></i><span>التقارير</span></button>
                <button class="more-item" onclick="navigateTo('invoices'); closeMorePanel();"><i class="fas fa-file-invoice"></i><span>الفواتير</span></button>
                <button class="more-item" onclick="navigateTo('returns'); closeMorePanel();"><i class="fas fa-undo-alt"></i><span>مرتجعات</span></button>
                <button class="more-item" onclick="navigateTo('treasury'); closeMorePanel();"><i class="fas fa-vault"></i><span>الخزنة</span></button>
                <button class="more-item" onclick="navigateTo('bonds'); closeMorePanel();"><i class="fas fa-file-signature"></i><span>السندات</span></button>
                <button class="more-item" onclick="navigateTo('accounting'); closeMorePanel();"><i class="fas fa-calculator"></i><span>محاسبات</span></button>
                <button class="more-item" onclick="navigateTo('customer_statement'); closeMorePanel();"><i class="fas fa-file-invoice-dollar"></i><span>كشف عميل</span></button>
                <button class="more-item" onclick="navigateTo('supplier_statement'); closeMorePanel();"><i class="fas fa-file-invoice"></i><span>كشف مورد</span></button>
                <button class="more-item" onclick="navigateTo('barcode'); closeMorePanel();"><i class="fas fa-qrcode"></i><span>الباركود</span></button>
                <button class="more-item" onclick="navigateTo('accounts'); closeMorePanel();"><i class="fas fa-sitemap"></i><span>الحسابات</span></button>
                <button class="more-item" onclick="navigateTo('profit_analysis'); closeMorePanel();"><i class="fas fa-chart-line"></i><span>تحليل الأرباح</span></button>
                <button class="more-item" onclick="navigateTo('audit'); closeMorePanel();"><i class="fas fa-history"></i><span>النشاطات</span></button>
                <button class="more-item" onclick="navigateTo('alerts'); closeMorePanel();"><i class="fas fa-bell"></i><span>التنبيهات</span></button>
                <button class="more-item" onclick="navigateTo('company'); closeMorePanel();"><i class="fas fa-building"></i><span>الشركة</span></button>
                <button class="more-item" onclick="navigateTo('backup'); closeMorePanel();"><i class="fas fa-cloud-upload-alt"></i><span>النسخ</span></button>
                <button class="more-item" onclick="navigateTo('settings'); closeMorePanel();"><i class="fas fa-cog"></i><span>الإعدادات</span></button>
                <button class="more-item" onclick="navigateTo('users'); closeMorePanel();"><i class="fas fa-user-cog"></i><span>المستخدمين</span></button>
                <button class="more-item" onclick="navigateTo('inventory_adjustment'); closeMorePanel();"><i class="fas fa-balance-scale"></i><span>تسوية</span></button>
            </div>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <!-- ================================================================ -->

    <!-- ===== أولاً: المكتبات الخارجية ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <!-- ===== ثانياً: الملفات الأساسية ===== -->
    <script src="modules/utils.js"></script>
    <script src="modules/database.js"></script>
    <script src="modules/firebase.js"></script>

    <!-- ===== ثالثاً: app.js ===== -->
    <script src="app.js"></script>

    <!-- ===== رابعاً: الملفات الوظيفية ===== -->
    <script src="modules/products.js"></script>
    <script src="modules/customers.js"></script>
    <script src="modules/suppliers.js"></script>
    <script src="modules/warehouses.js"></script>

    <!-- ===== خامساً: الفواتير ===== -->
    <script src="modules/sales.js"></script>
    <script src="modules/purchases.js"></script>
    <script src="modules/returns.js"></script>

    <!-- ===== سادساً: المالية ===== -->
    <script src="modules/expenses.js"></script>
    <script src="modules/treasury.js"></script>
    <script src="modules/bonds.js"></script>

    <!-- ===== سابعاً: المخازن والإذونات ===== -->
    <script src="modules/permissions.js"></script>
    <script src="modules/inventory_adjustment.js"></script>

    <!-- ===== ثامناً: المستخدمين والإعدادات ===== -->
    <script src="modules/users.js"></script>
    <script src="modules/company.js"></script>
    <script src="modules/backup.js"></script>

    <!-- ===== تاسعاً: التقارير والتحليلات ===== -->
    <script src="modules/accounts.js"></script>
    <script src="modules/dashboard.js"></script>
    <script src="modules/remaining.js"></script>

    <!-- ===== عاشراً: الأدوات ===== -->
    <script src="modules/audit.js"></script>
    <script src="modules/alerts.js"></script>
    <script src="modules/qr.js"></script>
    <script src="modules/barcode.js"></script>
    <script src="modules/cashier.js"></script>

    <!-- ===== أخيراً: تشغيل التطبيق ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 بدء تشغيل الميزان v3.0.0');
            
            // تهيئة Firebase
            if (typeof initFirebase === 'function') {
                initFirebase();
                console.log('✅ تم تهيئة Firebase');
            }
            
            // تهيئة المستخدمين
            if (typeof initUsers === 'function') {
                initUsers();
                console.log('✅ تم تهيئة المستخدمين');
            }
            
            // تفعيل الترخيص التجريبي
            if (typeof activateDemoLicense === 'function') {
                activateDemoLicense();
                console.log('✅ تم تفعيل الترخيص التجريبي');
            }
            
            // تهيئة البيانات
            if (typeof seedData === 'function') {
                seedData();
                console.log('✅ تم تهيئة البيانات');
            }
            
            // تحديث جميع الصفحات
            if (typeof refreshAllPages === 'function') {
                refreshAllPages();
                console.log('✅ تم تحديث جميع الصفحات');
            }
            
            // ✅ تحديث الساعة والتاريخ
            if (typeof updateClock === 'function') {
                updateClock();
                console.log('✅ تم تحديث الساعة والتاريخ');
            }
            
            // تحديث لوحة التحكم
            if (typeof updateDashboard === 'function') {
                updateDashboard();
                console.log('✅ تم تحديث لوحة التحكم');
            }
            
            // تحديث زر الأمن
            if (typeof updateSecurityButton === 'function') {
                updateSecurityButton();
            }
            
            // التحقق من حالة الترخيص
            if (typeof checkLicenseStatus === 'function') {
                checkLicenseStatus();
            }
            
            // عرض المفاتيح المُنشأة
            if (typeof renderGeneratedKeys === 'function') {
                renderGeneratedKeys();
            }
            
            // تهيئة الكاشير
            if (typeof initCashier === 'function') {
                initCashier();
                console.log('✅ تم تهيئة الكاشير');
            }
            
            // التحقق من حالة الدخول
            if (localStorage.getItem('app_unlocked') === 'true') {
                const loginContainer = document.getElementById('loginContainer');
                const appContent = document.getElementById('appContent');
                if (loginContainer) loginContainer.classList.add('hidden');
                if (appContent) appContent.style.display = 'block';
            }
            
            console.log('✅ الميزان جاهز للاستخدام');
            console.log('🔒 كلمة المرور: 123456');
            console.log('🔑 اضغط 5 مرات على رقم الإصدار في الإعدادات لتفعيل زر توليد المفاتيح');
        });
    </script>

</body>
</html>
